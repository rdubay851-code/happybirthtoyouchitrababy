<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070812">
<title>CHITRA — A Sky Written For You</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-mode="aurora">
<canvas id="sky"></canvas><div class="aurora"></div><div class="grain"></div>
<div id="app">
<header class="topbar">
 <button class="brand" data-route="home"><i></i><strong>CHITRA</strong><span>A SKY WRITTEN FOR YOU</span></button>
 <div class="top-actions"><button class="mode-chip" id="modeChip">✦ <span id="modeName">AURORA</span></button><button class="menu-btn" id="menuBtn">☰ <span>EXPLORE</span></button></div>
</header>
<aside class="drawer" id="drawer">
 <div class="drawer-head"><div><small>THE ARCHIVE</small><h2>Choose a world.</h2></div><button id="closeDrawer">×</button></div>
 <nav id="nav"></nav>
 <div class="drawer-label">ATMOSPHERE</div>
 <div class="mode-grid">
  <button data-mode="aurora">✦ Aurora<small>Wonder</small></button>
  <button data-mode="moon">☾ Moon<small>Quiet</small></button>
  <button data-mode="rose">♡ Rose<small>Warmth</small></button>
  <button data-mode="midnight">∞ Midnight<small>Depth</small></button>
 </div>
</aside>
<main id="main"></main>
<div id="toast"></div>
</div>
<script src="app.js"></script>
</body>
</html>
